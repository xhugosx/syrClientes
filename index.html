<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="asset/logo.svg">
    <title>Portal de Clientes</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/sesion.css">
</head>

<body>

    <div class="container-fluid vh-100 p-0">
        <div class="row g-0 h-100">

            <!-- LADO IZQUIERDO (branding) -->
            <div class="col-lg-5 d-none d-lg-flex branding-section">
                <div class="branding-content text-center">
                    <img src="asset/logo_cliente.svg" class="logo mb-4">
                    <h1>Portal de Clientes</h1>
                    <p>Consulta tus pedidos, estatus y productos</p>
                </div>
            </div>

            <!-- LADO DERECHO (login) -->
            <div class="col-lg-7 d-flex align-items-center justify-content-center login-section">

                <div class="login-box p-5">

                    <div class="text-center mb-4">
                        <img src="asset/logo.svg" class="logo-small mb-3">
                        <h3>Iniciar Sesión</h3>
                    </div>

                    <form id="login-form">
                        <div class="mb-3">
                            <label>RFC</label>
                            <input name="rfc" type="text" class="form-control custom-input" placeholder="ABC123456789"
                                required>
                        </div>

                        <div class="mb-4">
                            <label>Contraseña</label>
                            <input name="contrasena" type="password" class="form-control custom-input"
                                placeholder="••••••••" required>
                        </div>

                        <button id="btn-sesion" class="btn btn-login w-100 mb-3">Entrar al portal</button>

                    </form>

                </div>

            </div>

        </div>
    </div>

    <div id="alerta" class="custom-alert d-none">

        <div id="alertaIcono" class="alert-icon">
            <i class="bi bi-exclamation-circle-fill"></i>
        </div>

        <div class="alert-content">
            <h5 id="alertaTitulo">Título</h5>
            <p id="alertaMensaje">Mensaje</p>
        </div>

        <button class="alert-close" onclick="cerrarAlerta()">
            <i class="bi bi-x-lg"></i>
        </button>

    </div>
    <div id="loader" class="loader-overlay d-none">
        <div class="loader-box">
            <img src="asset/logo.svg" class="loader-logo">
            <div class="loader-spinner"></div>
            <h5>Cargando</h5>
            <p>Estamos preparando tus datos...</p>
        </div>
    </div>

    
    <!-- jquery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
