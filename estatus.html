<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="asset/logo.svg">

    <title>Estatus | Portal Clientes</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">

   

</head>

<body>

    <div class="container-fluid vh-100 p-0">

        <div class="row g-0 h-100">

            <!-- SIDEBAR -->
            <div class="col-xl-2 col-lg-3 sidebar">

                <div class="sidebar-top">
                    <img src="asset/logo.svg" class="sidebar-logo">
                    <h5>Portal Clientes</h5>
                </div>

                <div class="sidebar-menu">

                    <a href="productos.html" class="sidebar-item">
                        <i class="bi bi-box-seam"></i>
                        Productos
                    </a>

                    <a href="estatus.html" class="sidebar-item active">
                        <i class="bi bi-clock-history"></i>
                        Estatus
                    </a>

                    <a href="historial.html" class="sidebar-item">
                        <i class="bi bi-file-earmark-text"></i>
                        Historial
                    </a>

                </div>

            </div>

            <!-- CONTENIDO -->
            <div class="col-xl-10 col-lg-9 content-section">

                <!-- HEADER -->
                <div class="content-header">

                    <div>
                        <h2 class="content-title">Estatus de pedidos</h2>
                        <p>Consulta el avance de tus pedidos</p>
                    </div>

                    <button id="cerrarSesion" class="btn btn-login">
                        <i class="bi bi-box-arrow-right"></i>
                        Cerrar sesión
                    </button>

                </div>

                <!-- CONTENIDO -->
                <div class="estatus-wrapper content-card">

                    <!-- FILTROS -->
                    <div class="estatus-top">

                        <div class="search-box">
                            <i class="bi bi-search"></i>
                            <input type="text" id="buscador" placeholder="Buscar pedido, producto u orden de compra...">
                        </div>

                        <div class="estatus-filters">

                            <select class="estatus-select" id="filtroEstado">
                                <option value="">Todos los estatus</option>
                                <option value="0">Pendiente</option>
                                <option value="1">En proceso</option>
                                <option value="2">Terminado</option>
                            </select>

                        </div>

                    </div>

                    <!-- GRID -->
                    <div class="estatus-grid">
                        <div class="pedidos-grid" id="contenedorPedidos">
                            
                        </div>
                    </div>

                    <!-- PAGINACIÓN -->
                    <div class="estatus-pagination" id="paginacionPedidos">

                        <button class="page-btn">
                            <i class="bi bi-chevron-left"></i>
                        </button>

                        <button class="page-btn active">
                            1
                        </button>

                        <button class="page-btn">
                            2
                        </button>

                        <button class="page-btn">
                            3
                        </button>

                        <button class="page-btn">
                            <i class="bi bi-chevron-right"></i>
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- ALERTA -->
    <div id="alerta" class="custom-alert d-none">

        <div id="alertaIcono" class="alert-icon">
            <i class="bi bi-exclamation-circle-fill"></i>
        </div>

        <div class="alert-content">
            <h5 id="alertaTitulo">Título</h5>
            <p id="alertaMensaje">Mensaje</p>
        </div>

        <button class="alert-close" onclick="cerrarAlerta()">
            <i class="bi bi-x-lg"></i>
        </button>

    </div>

    <!-- LOADER -->
    <div id="loader" class="loader-overlay d-none">

        <div class="loader-box">
            <img src="asset/logo.svg" class="loader-logo">
            <div class="loader-spinner"></div>
            <h5>Cargando</h5>
            <p>Estamos preparando tus datos...</p>
        </div>

    </div>

    
    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/estatus.js"></script>

</body>

</html>
